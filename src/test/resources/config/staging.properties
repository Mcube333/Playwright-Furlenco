# ---- Staging Environment Configuration ----
# NOTE: stag.furlenco.com is only reachable from Furlenco's internal network/VPN.
# Runners (local or CI) executing against this environment must be connected to that VPN first.

web.base.url=https://stag.furlenco.com
furlenco.base.url=https://stag.furlenco.com
browser=chromium
headless=true
default.timeout.ms=30000
slowmo.ms=0

# Furlenco's own app backend (iOS/Android) — distinct from stag.furlenco.com above, which is the
# web frontend. Its request/response contract (see FurlencoReturnsApiTest) was captured from a
# real mobile-app network session on 2026-09-22, but a live call to this host from this sandbox
# (no VPN) got back a bare "404 page not found" rather than a connection failure — i.e. reached
# a real server, just not (as far as could be confirmed here) the right backend. Most likely this
# host is gated the same way stag.furlenco.com is (VPN-only) and a public edge/CDN serves that
# 404 as a catch-all for unmatched routes. NOT independently verified reachable — the first thing
# to check if FurlencoReturnsApiTest fails is whether the runner is on Furlenco's internal VPN.
api.base.url=https://st-ciago.furlenco.com/api/v1

# KYC lives on a DIFFERENT host than everything else above — st-cia.furlenco.com (no "go"), not
# st-ciago.furlenco.com (see FurlencoKycApiTest). Not a typo as far as the capture shows, but this
# also hasn't been independently verified reachable — same VPN caveat as api.base.url above.
api.kyc.base.url=https://st-cia.furlenco.com/api/v1

test.user.username=8088253943
test.user.password=1234

# Required headers for every st-ciago.furlenco.com call beyond auth (city/pincode context the
# app pins per-request). Values below match a live serviceable city/pincode pair seen on staging.
api.city.id=7
api.pincode=500046

db.host=staging-db.internal
db.port=5432
db.name=staging_db
db.user=
db.password=
db.pool.size=5

api.token=

retry.max.count=2
thread.count=4

# Native mobile app (Appium) — PLACEHOLDERS, see qa.properties / AppiumManager javadoc.
appium.server.url=http://127.0.0.1:4723
appium.platform=android
appium.device.name=
appium.platform.version=
appium.app.path=
appium.app.package=
appium.app.activity=
appium.bundle.id=
appium.no.reset=true
appium.command.timeout.seconds=60

# AI Foundation Layer (Disabled by default)
ai.enabled=false
ai.provider=gemini
ai.model=
ai.failure.analysis.enabled=false
ai.timeout.seconds=20

# Phase 6: AI Locator Advisor runtime (live Playwright Page) validation (Disabled by default)
ai.locator.runtime.validation.enabled=false
ai.locator.runtime.allowed.environments=qa,staging
