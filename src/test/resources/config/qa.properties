# ---- QA Environment Configuration ----

# Web
web.base.url=https://www.saucedemo.com
furlenco.base.url=https://www.furlenco.com
browser=chromium
headless=true
default.timeout.ms=30000
slowmo.ms=0

# API
api.base.url=https://reqres.in/api

# Test users (non-sensitive demo creds only — never put real secrets here)
test.user.username=standard_user
test.user.password=secret_sauce

# DB (local dev fallback only — CI must inject via env vars: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
db.host=localhost
db.port=5432
db.name=qa_db
db.user=qa_user
db.password=changeit
db.pool.size=5

# API auth (fallback only — CI must inject API_TOKEN via env var / secret)
api.token=

# Retry
retry.max.count=2

# Parallel execution
thread.count=4
